<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 업무 트래커 · Mention</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="brand" href="./">mention<span class="local">LOCAL</span></a>
<div class="app">
<aside class="sidebar">
<div class="workspace"><img class="workspace-icon profile-photo" src="assets/avatar-default.svg" alt="내 프로필 사진"><div><span id="workspace-title">내 업무함</span><small>개인 업무 공간</small></div><span class="workspace-dot"></span></div>
<div class="nav-label">내 업무</div>
<nav aria-label="메인 메뉴"><button class="nav-item selected" id="today-nav"><svg class="montage-icon nav-symbol" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="assets/montage-icons.svg#list"></use></svg>업무 목록<span id="nav-count" class="nav-count">0</span></button></nav>
<div class="source-group"><div class="nav-label">가져온 대화</div><div class="source-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.5 5.1a18 18 0 0 0-4.4-1.4l-.6 1.2a17 17 0 0 0-5 0l-.6-1.2a18 18 0 0 0-4.4 1.4C1.7 9.2 1 13.2 1.4 17.1a18 18 0 0 0 5.4 2.7l1.1-1.9-1.7-.8.4-.3a12.8 12.8 0 0 0 10.8 0l.4.3-1.7.8 1.1 1.9a18 18 0 0 0 5.4-2.7c.5-4.5-.8-8.4-3.1-12ZM8.6 14.7c-1 0-1.7-.9-1.7-2s.7-2 1.7-2 1.7.9 1.7 2-.7 2-1.7 2Zm6.8 0c-1 0-1.7-.9-1.7-2s.7-2 1.7-2 1.7.9 1.7 2-.7 2-1.7 2Z"/></svg><span>Discord</span><span class="source-note">예시 데이터</span></div><div class="server"><span class="server-dot"></span> 내 대화</div></div>
<div class="sidebar-bottom"><div class="user"><img class="avatar profile-photo" src="assets/avatar-default.svg" alt="내 프로필 사진"><div><span id="profile-name">사용자</span><small id="profile-role"></small></div><span class="user-dot"></span></div></div>
</aside>
<main>
<header class="topbar"><span>내 업무함 <span class="slash">/</span> <strong>오늘의 할 일</strong></span><img class="header-avatar profile-photo" src="assets/avatar-default.svg" alt="내 프로필 사진"></header>
<div class="content">
<div class="intro"><div class="eyebrow">내 업무</div><div class="title-line"><h1>내 업무 트래커<span class="title-dot">.</span></h1><label class="date-filter">기간 <select id="date-filter" aria-label="조회 기간"><option value="all">전체 기간</option></select></label></div></div>
<div class="scope-bar"><label class="project-filter">프로젝트 <select id="project-filter" aria-label="프로젝트 선택"><option value="all">전체 프로젝트</option></select></label><div class="type-filters" role="group" aria-label="업무 종류"><button type="button" data-type="all" aria-pressed="true">전체</button><button type="button" data-type="design" aria-pressed="false">디자인</button><button type="button" data-type="planning" aria-pressed="false">기획</button><button type="button" data-type="review" aria-pressed="false">리뷰</button><button type="button" data-type="marketing" aria-pressed="false">마케팅</button></div></div>
<section class="summary" aria-label="오늘의 업무 요약"><div class="summary-main"><div><span id="summary-heading">업무를 불러오고 있습니다</span><p id="summary-context">진행 중인 내 할 일과 요청한 일을 확인합니다.</p></div><strong id="summary-count">00</strong></div><div class="summary-meta"><span>정리한 항목 <b id="total-count">0</b></span><i></i><span>완료 <b id="done-count">0</b></span><i></i><span>공유 <b id="shared-count">0</b></span></div></section>
<section class="work-panel" aria-label="나의 할 일"><div class="list-toolbar"><div class="tabs" role="tablist" aria-label="업무 상태"><button role="tab" aria-selected="true" data-tab="todo">할 일 <span id="todo-tab-count">0</span></button><button role="tab" aria-selected="false" data-tab="done">완료 <span id="done-tab-count">0</span></button><button role="tab" aria-selected="false" data-tab="reference">공유 <span id="shared-tab-count">0</span></button></div><label class="category-filter">분류 <select id="category-filter" aria-label="업무 분류"><option value="all">전체</option><option value="mine">내 할 일</option><option value="requested">요청한 일</option><option value="question">내가 한 질문</option><option value="shared">공유</option></select></label></div>
<div class="list-heading"><span id="list-heading">지금 확인해 주세요</span><span>내용을 펼쳐 맥락을 확인할 수 있습니다</span></div>
<section id="tasks" aria-label="업무 목록"></section></section>
</div>
</main>
</div>
<div class="toast" role="status" aria-live="polite" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body></html>
